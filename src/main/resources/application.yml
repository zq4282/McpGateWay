spring:
  application:
    name: mcp-gateway

  datasource:
    url: jdbc:sqlite:./mcp-gateway.db
    driver-class-name: org.sqlite.JDBC

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  ai:
    mcp:
      server:
        # MCP Server 名称与版本
        name: mcp-gateway
        version: 1.0.0
        type: SYNC
        protocol: STATELESS
        capabilities:
          tool: true
          resource: true
          prompt: true
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

server:
  port: 8080

logging:
  level:
    com.zmm.mcp: DEBUG
